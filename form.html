<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <fieldset>
        <legend>BioData</legend>
        <form action="./response.html" name="" target="_self" method="get">

            <label for="name">UserName:</label>
            <input type="text" name="name" id="name" placeholder="Enter your name " required>  

            <br><br>
            <label for="pass">Password:</label>
            <input type="password" name="pass" pattern="[A-Z,a-z,0-9]" required>  

            <br><br>
            <label for="dob">DOB:</label>
            <input type="date" name="dob" id="dob" min="18" max="25">   
            
            <br><br>
            <label for="gender">Gender:</label>
            <input type="radio" name="gender" id="gender">
            <label for="gender">Male</label>
            <input type="radio" name="gender" id="gender">
            <label for="gender">Female</label>

            <br><br>
            <label for="hobb">Hobbies:</label>
            <input type="checkbox" name="hobb1" id="hobb">
            <label for="hobb">Cricket</label>
            <input type="checkbox" name="hobb2" id="hobb">
            <label for="hobb">Football</label>
            <input type="checkbox" name="hobb3" id="hobb">
            <label for="hobb">Basketball</label>

            <br><br>
            <label for="add">Address</label>
            <textarea name="add" id="add" minlength="10" maxlength="40"></textarea>

            <br><br>
            <label for="tel">Phone:</label>
            <input type="tel" name="tel" id="tel">

            <br><br>
            <label for="email">Email:</label>
            <input type="email" name="email" id="email">

            <br><br>
            <label for="">Attempt:</label>
            <input type="number" name="att" id="att">

            <br><br>
            <label for="url">Homepage:</label>
            <input type="url" name="url" id="url">

            <br><br>
            <label for="file">Resume Upload</label>
            <input type="file" name="file" id="file">

            <br><br>
            <label for="lang">Select Language</label>
            <select name="lang" id="lang">
                <option value="select"></option>
                <option value="C">C</option>
                <option value="C++">C++</option>
                <option value="Java">Java</option>
                <option value="Python">Python</option>
            </select>

            <br><br>
            <input type="submit">
            <input type="reset">
        </form>
    </fieldset>
</body>
</html>
